name: Public Portfolio Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject product source directories
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '^(apps|agents|services|infra|database|data|scripts|tests|tools)/'; then
            echo "Product source directory found in the public portfolio."
            exit 1
          fi

      - name: Reject generated or sensitive artifacts
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '\.(apk|aab|exe|dll|msi|msix|dump|sqlite|sqlite3|pfx|p12|jks|keystore)$'; then
            echo "Generated or sensitive artifact found."
            exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.example$'; then
            echo "Runtime environment file found."
            exit 1
          fi

      - name: Validate Pages file links
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit, unquote

          docs = Path("docs").resolve()
          pages = [docs / name for name in ("index.html", "en.html", "gallery.html")]
          errors = []

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key in ("href", "src") and value:
                          self.links.append((tag, key, value))

          for page in pages:
              if not page.is_file():
                  errors.append(f"Missing HTML page: {page}")
                  continue
              parser = LinkParser()
              parser.feed(page.read_text(encoding="utf-8"))
              for tag, key, original in parser.links:
                  url = urlsplit(original)
                  if url.scheme or url.netloc or original.startswith(("#", "//", "mailto:", "tel:")):
                      continue
                  relative = unquote(url.path)
                  if not relative:
                      continue
                  target = (page.parent / relative).resolve()
                  if not target.is_relative_to(docs):
                      errors.append(f"{page.name}: link escapes published docs: {original}")
                  elif relative.lower().endswith(".md"):
                      errors.append(f"{page.name}: link targets raw Markdown with .nojekyll: {original}")
                  elif not target.is_file():
                      errors.append(f"{page.name}: missing {key} target: {original}")

          if errors:
              raise SystemExit("\n".join(errors))
          print("PAGES_LINKS=PASS pages=3")
          PY

      - name: Validate public brand media
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          for relative in (
              "docs/public/assets/portfolio-hero-premium.jpg",
              "docs/public/assets/social-preview.jpg",
          ):
              path = Path(relative)
              data = path.read_bytes()
              if not (30_000 <= len(data) <= 2_000_000):
                  raise SystemExit(f"Invalid brand image size: {relative} ({len(data)} bytes)")
              if not (data.startswith(bytes.fromhex("ffd8")) and data.endswith(bytes.fromhex("ffd9"))):
                  raise SystemExit(f"Invalid JPEG markers: {relative}")
              print(f"BRAND_MEDIA=PASS {relative} bytes={len(data)}")
          PY

      - name: Reject assistant attribution markers
        shell: bash
        run: |
          set -euo pipefail
          TERM_A='Chat''GPT'
          TERM_B='Co''dex'
          TERM_C='Open''AI'
          if git grep -n -I -F -e "$TERM_A" -e "$TERM_B" -e "$TERM_C" -- .; then
            echo "Assistant attribution marker found."
            exit 1
          fi

      - name: Reject obvious credential patterns
        shell: bash
        run: |
          set -euo pipefail
          P1='github_'pat_
          P2='gh''p_'
          P3='AK''IA'
          if git grep -n -I -E "$P1|$P2|$P3[0-9A-Z]{16}" -- .; then
            echo "Credential-like pattern found."
            exit 1
          fi

      - name: Publication guard passed
        run: echo "Public portfolio guard passed."
