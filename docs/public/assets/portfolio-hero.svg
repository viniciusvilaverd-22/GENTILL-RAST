  </radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect width="1200" height="520" rx="28" fill="url(#bg)"/>
<circle cx="1030" cy="92" r="135" fill="#d8aa4b" opacity=".08" filter="url(#glow)"/>
<circle cx="970" cy="440" r="170" fill="#8a5f24" opacity=".06" filter="url(#glow)"/>
<g transform="translate(72 68) scale(.31)">
  <g fill="none" stroke="url(#gold)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round">
    <path d="M88 248 A168 168 0 0 1 248 88"/><path d="M286 76 A184 184 0 0 1 436 248"/>
    <path d="M94 292 A164 164 0 0 0 256 444"/><path d="M256 444 A164 164 0 0 0 408 292"/>
    <path d="M252 160 A96 96 0 0 1 348 256"/><path d="M252 210 A46 46 0 0 1 298 256"/>
