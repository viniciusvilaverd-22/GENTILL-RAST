<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">REST Gentill — Enterprise Asset Intelligence &amp; Tracking Platform</title>
<desc id="desc">Portfolio banner for REST Gentill showing architecture, security, tracking and multi-platform scope.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#090b0d"/><stop offset="0.55" stop-color="#11151a"/><stop offset="1" stop-color="#171b20"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff0b5"/><stop offset=".22" stop-color="#f2c86d"/><stop offset=".5" stop-color="#b87520"/><stop offset=".72" stop-color="#edbd5c"/><stop offset="1" stop-color="#855116"/>
  </linearGradient>
  <radialGradient id="orb" cx=".34" cy=".28" r=".72">
