<line x1="72" y1="410" x2="1128" y2="410" stroke="#2d333a"/>
<text x="72" y="451" fill="#a7afb7" font-family="Segoe UI, Arial, sans-serif" font-size="18">Web · PWA · Windows · Android · Linux</text>
<text x="1128" y="451" text-anchor="end" fill="#d7b25b" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Vinícius Vilaverde</text>
<text x="1128" y="479" text-anchor="end" fill="#7f8790" font-family="Segoe UI, Arial, sans-serif" font-size="14">Product &amp; System Architecture</text>
