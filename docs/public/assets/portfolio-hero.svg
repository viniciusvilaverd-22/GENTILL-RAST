</g>
<text x="250" y="118" fill="#f5f0e6" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="1.5">REST Gentill</text>
<text x="252" y="158" fill="#c8c1b6" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="500" letter-spacing="1.1">ENTERPRISE ASSET INTELLIGENCE &amp; TRACKING PLATFORM</text>
<text x="72" y="240" fill="#f0ece5" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="650">Identity. Custody. Location. Audit.</text>
<text x="72" y="278" fill="#9ea6ad" font-family="Segoe UI, Arial, sans-serif" font-size="20">A portfolio case in product architecture, security, telemetry and multi-platform systems.</text>
<g font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing=".6">
  <g transform="translate(72 324)"><rect width="148" height="42" rx="21" fill="#1d2228" stroke="#5b626a"/><text x="74" y="27" text-anchor="middle" fill="#e8e2d7">ASSET MODEL</text></g>
  <g transform="translate(236 324)"><rect width="130" height="42" rx="21" fill="#1d2228" stroke="#5b626a"/><text x="65" y="27" text-anchor="middle" fill="#e8e2d7">IDENTITY</text></g>
  <g transform="translate(382 324)"><rect width="130" height="42" rx="21" fill="#1d2228" stroke="#5b626a"/><text x="65" y="27" text-anchor="middle" fill="#e8e2d7">TRACKING</text></g>
  <g transform="translate(528 324)"><rect width="112" height="42" rx="21" fill="#1d2228" stroke="#5b626a"/><text x="56" y="27" text-anchor="middle" fill="#e8e2d7">AUDIT</text></g>
  <g transform="translate(656 324)"><rect width="126" height="42" rx="21" fill="#1d2228" stroke="#b88634"/><text x="63" y="27" text-anchor="middle" fill="#f0c86e">SECURITY</text></g>
